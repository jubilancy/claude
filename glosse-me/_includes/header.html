<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/archive/' | relative_url }}">Archive</a>
    <a href="{{ '/tags/' | relative_url }}">Tags</a>
    <a href="{{ '/search/' | relative_url }}">Search</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <button id="theme-toggle" type="button" aria-label="Toggle dark/light mode">◐</button>
  </nav>
</header>
<script>
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var el = document.documentElement;
    var dark = el.dataset.theme ? el.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    el.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
</script>
