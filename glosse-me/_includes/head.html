<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign t = page.title | default: page.summary | default: site.title -%}
<title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ t | strip_html | truncate: 60 }} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.summary | default: site.description | strip_html | escape }}">
{%- if page.images and page.images.size > 0 %}
<meta property="og:image" content="{{ page.images[0].url }}">
{%- endif %}
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<script>
  // Apply saved theme before paint to avoid a flash.
  try { var th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
</script>
